<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paramedic Drug Box</title>
<meta name="description" content="Flashcards, quizzes and write-out drills for the Motlow State paramedic pharmacology drug list (TN protocols).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="masthead">
  <h1 class="brand"><span class="star" aria-hidden="true">✳</span> Drug Box</h1>
  <span class="sub">Motlow State Paramedic · TN protocols</span>
</header>

<nav class="tabs" aria-label="Study modes">
  <div class="tabs-inner" role="tablist">
    <button class="tab" role="tab" id="tab-cards" data-tab="cards" aria-selected="true">Cards</button>
    <button class="tab" role="tab" id="tab-quiz" data-tab="quiz" aria-selected="false">Quiz</button>
    <button class="tab" role="tab" id="tab-write" data-tab="write" aria-selected="false">Write</button>
    <button class="tab" role="tab" id="tab-drugs" data-tab="drugs" aria-selected="false">Drugs</button>
    <button class="tab" role="tab" id="tab-progress" data-tab="progress" aria-selected="false">Stats</button>
  </div>
</nav>

<main>
  <section class="view" id="view-cards" role="tabpanel" aria-labelledby="tab-cards"></section>
  <section class="view" id="view-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden></section>
  <section class="view" id="view-write" role="tabpanel" aria-labelledby="tab-write" hidden></section>
  <section class="view" id="view-drugs" role="tabpanel" aria-labelledby="tab-drugs" hidden></section>
  <section class="view" id="view-progress" role="tabpanel" aria-labelledby="tab-progress" hidden></section>
</main>

<div class="overlay" id="setup" hidden></div>

<script src="js/drugs.js"></script>
<script src="js/grading.js"></script>
<script src="js/app.js"></script>
</body>
</html>
